[package]
name = "skillbasic"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
description = "A prompt-native BASIC interpreter for structured AI workflows"
readme = "README.md"
repository = "https://github.com/jskDr/skillbasic"
homepage = "https://github.com/jskDr/skillbasic"
keywords = ["basic", "interpreter", "ollama", "repl"]
categories = ["command-line-utilities"]

[workspace]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rustyline = "17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
